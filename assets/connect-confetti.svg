<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 88" width="560" height="88" role="img" aria-label="Connect">
  <title>Connect</title>
  <style>
    .t { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
    .hd { font-size: 24px; font-weight: 700; fill: #EBBCBA; }

    .p {
      transform-box: fill-box;
      transform-origin: center;
      animation: fall 2.9s linear infinite;
    }
    .s { animation-duration: 3.8s; }
    .f { animation-duration: 2.2s; }
    @keyframes fall {
      0%   { transform: translateY(-14px) rotate(0deg);  opacity: 0; }
      14%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(96px) rotate(620deg); opacity: 0; }
    }
  </style>

  <!-- Text sits under the confetti layer so pieces fall across the wording. -->
  <text class="t hd" x="280" y="56" text-anchor="middle">🤝 Connect</text>

  <rect class="p"   x="18"  y="0" width="5" height="8" rx="1" fill="#EBBCBA" style="animation-delay:-0.10s" />
  <rect class="p s" x="52"  y="0" width="4" height="7" rx="1" fill="#F2E9E4" style="animation-delay:-1.30s" />
  <rect class="p f" x="86"  y="0" width="6" height="6" rx="1" fill="#C9A9A6" style="animation-delay:-0.65s" />
  <rect class="p"   x="120" y="0" width="4" height="8" rx="1" fill="#7D6B75" style="animation-delay:-2.00s" />
  <rect class="p s" x="154" y="0" width="5" height="7" rx="1" fill="#EBBCBA" style="animation-delay:-0.35s" />
  <rect class="p"   x="188" y="0" width="4" height="8" rx="1" fill="#F2E9E4" style="animation-delay:-1.75s" />
  <rect class="p f" x="222" y="0" width="6" height="6" rx="1" fill="#C9A9A6" style="animation-delay:-2.55s" />
  <rect class="p"   x="256" y="0" width="4" height="7" rx="1" fill="#EBBCBA" style="animation-delay:-0.50s" />
  <rect class="p s" x="290" y="0" width="5" height="8" rx="1" fill="#7D6B75" style="animation-delay:-2.85s" />
  <rect class="p"   x="324" y="0" width="4" height="7" rx="1" fill="#F2E9E4" style="animation-delay:-0.95s" />
  <rect class="p f" x="358" y="0" width="6" height="6" rx="1" fill="#EBBCBA" style="animation-delay:-2.25s" />
  <rect class="p"   x="392" y="0" width="4" height="8" rx="1" fill="#C9A9A6" style="animation-delay:-0.80s" />
  <rect class="p s" x="426" y="0" width="5" height="7" rx="1" fill="#F2E9E4" style="animation-delay:-1.55s" />
  <rect class="p"   x="460" y="0" width="4" height="8" rx="1" fill="#EBBCBA" style="animation-delay:-2.70s" />
  <rect class="p f" x="494" y="0" width="6" height="6" rx="1" fill="#7D6B75" style="animation-delay:-0.25s" />
  <rect class="p"   x="528" y="0" width="4" height="7" rx="1" fill="#C9A9A6" style="animation-delay:-1.90s" />

  <circle class="p s" cx="36"  cy="5" r="3" fill="#EBBCBA" style="animation-delay:-2.40s" />
  <circle class="p"   cx="138" cy="5" r="2" fill="#F2E9E4" style="animation-delay:-1.10s" />
  <circle class="p f" cx="240" cy="5" r="3" fill="#C9A9A6" style="animation-delay:-0.90s" />
  <circle class="p"   cx="342" cy="5" r="2" fill="#EBBCBA" style="animation-delay:-2.15s" />
  <circle class="p s" cx="444" cy="5" r="3" fill="#F2E9E4" style="animation-delay:-1.45s" />
