<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" role="img" aria-label="Confetti celebration">
  <title>Confetti celebration</title>
  <style>
    .p {
      transform-box: fill-box;
      transform-origin: center;
      animation: fall 3s linear infinite;
    }
    .s { animation-duration: 3.9s; }
    .f { animation-duration: 2.3s; }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
    }
    .tada {
      transform-box: fill-box;
      transform-origin: center;
      animation: tada 3s ease-in-out infinite;
    }
    @keyframes tada {
      0%, 100% { transform: scale(1) rotate(0deg); }
      15%      { transform: scale(1.25) rotate(-12deg); }
      30%      { transform: scale(1.1) rotate(10deg); }
      45%      { transform: scale(1.2) rotate(-6deg); }
      60%      { transform: scale(1) rotate(0deg); }
    }
  </style>

  <text class="tada" x="36"  y="68" font-size="38" text-anchor="middle">🎉</text>
  <text class="tada" x="384" y="68" font-size="38" text-anchor="middle" style="animation-delay:-1.5s">🎊</text>

  <rect class="p"   x="92"  y="0" width="13" height="19" rx="2" fill="#EBBCBA" style="animation-delay:-0.1s" />
  <rect class="p s" x="120" y="0" width="11" height="17" rx="2" fill="#F2E9E4" style="animation-delay:-1.3s" />
  <rect class="p f" x="148" y="0" width="14" height="14" rx="2" fill="#C9A9A6" style="animation-delay:-0.6s" />
  <rect class="p"   x="176" y="0" width="11" height="20" rx="2" fill="#EBBCBA" style="animation-delay:-2.1s" />
  <rect class="p s" x="204" y="0" width="13" height="16" rx="2" fill="#F2E9E4" style="animation-delay:-0.4s" />
  <rect class="p"   x="232" y="0" width="12" height="19" rx="2" fill="#D8A7B1" style="animation-delay:-1.8s" />
  <rect class="p f" x="260" y="0" width="14" height="15" rx="2" fill="#EBBCBA" style="animation-delay:-2.6s" />
  <rect class="p"   x="288" y="0" width="11" height="18" rx="2" fill="#C9A9A6" style="animation-delay:-0.9s" />
  <rect class="p s" x="316" y="0" width="13" height="17" rx="2" fill="#F2E9E4" style="animation-delay:-2.9s" />
  <rect class="p f" x="344" y="0" width="12" height="16" rx="2" fill="#D8A7B1" style="animation-delay:-1.1s" />

  <circle class="p s" cx="106" cy="8" r="7" fill="#F2E9E4" style="animation-delay:-2.4s" />
  <circle class="p"   cx="162" cy="8" r="6" fill="#EBBCBA" style="animation-delay:-1.0s" />
  <circle class="p f" cx="218" cy="8" r="7" fill="#C9A9A6" style="animation-delay:-0.8s" />
  <circle class="p"   cx="274" cy="8" r="6" fill="#F2E9E4" style="animation-delay:-2.2s" />
  <circle class="p s" cx="330" cy="8" r="7" fill="#D8A7B1" style="animation-delay:-1.4s" />
</svg>
