<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" role="img" aria-label="Confetti celebration">
  <title>Confetti celebration</title>
  <style>
    .p {
      transform-box: fill-box;
      transform-origin: center;
      animation: fall 3.2s linear infinite;
    }
    .s { animation-duration: 4.1s; }
    .f { animation-duration: 2.6s; }
    @keyframes fall {
      0%   { transform: translateY(-24px) rotate(0deg);    opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateY(132px) rotate(680deg);  opacity: 0; }
    }
    .burst {
      transform-box: fill-box;
      transform-origin: center;
      animation: pop 3.2s ease-out infinite;
    }
    @keyframes pop {
      0%   { transform: scale(0.2); opacity: 0; }
      15%  { transform: scale(1);   opacity: 1; }
      55%  { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>

  <g class="burst">
    <circle cx="40"  cy="60" r="8" fill="none" stroke="#EBBCBA" stroke-width="2" />
    <circle cx="760" cy="60" r="8" fill="none" stroke="#EBBCBA" stroke-width="2" />
  </g>

  <rect class="p"    x="30"  y="0" width="7" height="11" rx="1" fill="#EBBCBA" style="animation-delay:-0.1s" />
  <rect class="p s"  x="68"  y="0" width="6" height="10" rx="1" fill="#7D6B75" style="animation-delay:-1.4s" />
  <rect class="p f"  x="105" y="0" width="8" height="8"  rx="1" fill="#C9A9A6" style="animation-delay:-0.7s" />
  <rect class="p"    x="143" y="0" width="6" height="12" rx="1" fill="#6E4B4F" style="animation-delay:-2.2s" />
  <rect class="p s"  x="181" y="0" width="7" height="9"  rx="1" fill="#F2E9E4" style="animation-delay:-0.35s" />
  <rect class="p"    x="219" y="0" width="6" height="11" rx="1" fill="#3E2A35" style="animation-delay:-1.9s" />
  <rect class="p f"  x="257" y="0" width="8" height="10" rx="1" fill="#EBBCBA" style="animation-delay:-2.8s" />
  <rect class="p"    x="295" y="0" width="6" height="9"  rx="1" fill="#7D6B75" style="animation-delay:-0.55s" />
  <rect class="p s"  x="333" y="0" width="7" height="12" rx="1" fill="#C9A9A6" style="animation-delay:-3.1s" />
  <rect class="p"    x="371" y="0" width="6" height="10" rx="1" fill="#F2E9E4" style="animation-delay:-1.05s" />
  <rect class="p f"  x="409" y="0" width="8" height="9"  rx="1" fill="#6E4B4F" style="animation-delay:-2.45s" />
  <rect class="p"    x="447" y="0" width="6" height="11" rx="1" fill="#EBBCBA" style="animation-delay:-0.85s" />
  <rect class="p s"  x="485" y="0" width="7" height="10" rx="1" fill="#4A3540" style="animation-delay:-1.65s" />
  <rect class="p"    x="523" y="0" width="6" height="12" rx="1" fill="#C9A9A6" style="animation-delay:-2.95s" />
  <rect class="p f"  x="561" y="0" width="8" height="8"  rx="1" fill="#7D6B75" style="animation-delay:-0.25s" />
  <rect class="p"    x="599" y="0" width="6" height="10" rx="1" fill="#F2E9E4" style="animation-delay:-2.05s" />
  <rect class="p s"  x="637" y="0" width="7" height="11" rx="1" fill="#EBBCBA" style="animation-delay:-1.25s" />
  <rect class="p"    x="675" y="0" width="6" height="9"  rx="1" fill="#6E4B4F" style="animation-delay:-3.0s" />
  <rect class="p f"  x="713" y="0" width="8" height="11" rx="1" fill="#C9A9A6" style="animation-delay:-1.75s" />
  <rect class="p"    x="751" y="0" width="6" height="10" rx="1" fill="#7D6B75" style="animation-delay:-0.45s" />

  <circle class="p s" cx="88"  cy="6" r="4" fill="#EBBCBA" style="animation-delay:-2.6s" />
  <circle class="p"   cx="200" cy="6" r="3" fill="#F2E9E4" style="animation-delay:-1.15s" />
  <circle class="p f" cx="314" cy="6" r="4" fill="#C9A9A6" style="animation-delay:-0.95s" />
  <circle class="p"   cx="428" cy="6" r="3" fill="#EBBCBA" style="animation-delay:-2.35s" />
  <circle class="p s" cx="542" cy="6" r="4" fill="#7D6B75" style="animation-delay:-1.55s" />
  <circle class="p"   cx="656" cy="6" r="3" fill="#F2E9E4" style="animation-delay:-0.65s" />
  <circle class="p f" cx="732" cy="6" r="4" fill="#EBBCBA" style="animation-delay:-2.15s" />
</svg>
